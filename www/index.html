<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sea Legacy</title>
    <style>
        body { margin: 0; background-color: #1a1a24; font-family: sans-serif; user-select: none; }
        #login-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 40px; border-radius: 10px; text-align: center; border: 2px solid #4a4a5a; width: 300px; }
        h1 { color: white; margin-top: 0; }
        input { display: block; width: 90%; padding: 10px; margin: 10px auto; border-radius: 5px; border: none; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #ffcc00; border: none; border-radius: 5px; font-weight: bold; font-size: 18px; cursor: pointer; }
        #game-world { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #87CEEB; }
        #hud { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        #chat-box { position: absolute; bottom: 20px; left: 20px; }
        #chat-input { width: 300px; padding: 12px; border-radius: 20px; border: 2px solid #555; background: rgba(0,0,0,0.7); color: white; font-size: 16px; }
    </style>
</head>
<body>
    <div id="login-box">
        <h1>SEA LEGACY</h1>
        <input type="text" id="username" placeholder="Username (Type Prince)">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">LOGIN</button>
    </div>

    <div id="game-world">
        <div id="hud">
            <div>Lv. <span id="level">1</span></div>
            <div>Beli: $<span id="money">0</span></div>
        </div>
        <div id="chat-box">
            <input type="text" id="chat-input" placeholder="Type /lvl 2450..." onkeypress="handleChat(event)">
        </div>
    </div>

    <script>
        function login() {
            const user = document.getElementById('username').value;
            if(user === "") return alert("Enter a name!");
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('game-world').style.display = 'block';
            if(user.toLowerCase() === "prince") {
                document.getElementById('level').innerText = "2450 (ADMIN)";
                document.getElementById('money').innerText = "99,999,999";
            }
        }
        function handleChat(e) {
            if (e.key === 'Enter') {
                const val = e.target.value;
                e.target.value = "";
                if(val.startsWith("/lvl ")) {
                    const newLvl = val.split(" ")[1];
                    document.getElementById('level').innerText = newLvl + " (ADMIN)";
                }
            }
        }
    </script>
</body>
</html>

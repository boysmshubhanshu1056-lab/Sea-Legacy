<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sea Legacy</title>
    <!-- Load Three.js (3D Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a24; font-family: sans-serif; user-select: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #login-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 40px; border-radius: 10px; text-align: center; pointer-events: auto; border: 2px solid #4a4a5a; }
        input { display: block; width: 250px; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #ffcc00; border: none; border-radius: 5px; font-weight: bold; font-size: 18px; cursor: pointer; }
        #hud { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; text-shadow: 2px 2px 0 #000; display: none; }
        #chat-box { position: absolute; bottom: 20px; left: 20px; pointer-events: auto; display: none; }
        #chat-input { widthlay: -->
 300px; padding:     <10px; border-radius:div 20px; border: 2px solid #555; background: rgba(0,0,0,0.7); color: white; }
    </style>
</head>
<body>

    <!-- UI Over id="ui-layer">
        <div id="login-box">
            <h1 style="color: white; margin-top: 0;">SEA LEGACY</h1>
            <input type="text" id="username" placeholder="Username (Type Prince)">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">LOGIN</button>
        </div>

        <div id="hud">
            <div>Lv. <span id="level">2450</span></div>
            <div>Beli: $<span id="money">99,999,999</span></div>
        </div>

        <div id="chat-box">
            <input type="text" id="chat-input" placeholder="Type /tp, /br..." onkeypress="handleChat(event)">
        </div>
    </div>

    <!-- 3D World Container -->
    <div id="game-container"></div>

    <script>
        let scene, camera, renderer, player;
        let isGameRunning = false;

        // 1. LOGIN LOGIC
        function login() {
            const user = document.getElementById('username').value;
            if(user === "") return alert("Enter a name!");
            
            // Hide Login, Show Game
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('chat-box').style.display = 'block';

            if(user === "Prince") {
                document.getElementById('level').innerText = "2450 (ADMIN)";
            } else {
                document.getElementById('level').innerText = "1";
                document.getElementById('money').innerText = "0";
            }

            startGame();
        }

        // 2. CHAT & ADMIN COMMANDS
        function handleChat(e) {
            if (e.key === 'Enter') {
                const val = e.target.value;
                e.target.value = "";
                if(val.startsWith("/")) {
                    processAdminCommand(val);
                } else {
                    console.log("Chat sent: " + val);
                }
            }
        }

        function processAdminCommand(cmd) {
            const parts = cmd.split(" ");
            if(parts[0] === "/lvl") {
                document.getElementById('level').innerText = parts[1] + " (ADMIN)";
            } else if(parts[0] === "/g") {
                alert("ADMIN: Gave item " + parts[1]);
            } else if(parts[0] === "/tp") {
                // Teleport logic later
                alert("ADMIN: Teleported to " + parts[1]);
            }
        }

        // 3. THREE.JS 3D WORLD
        function startGame() {
            if(isGameRunning) return;
            isGameRunning = true;

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue

            // Camera (Top-down angled, like Blox Fruits)
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 15);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Sea 1 Ground (Brown Island)
            const geometry = new THREE.BoxGeometry(50, 2, 50);
            const material = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
            const ground = new THREE.Mesh(geometry, material);
            ground.position.y = -1;
            scene.add(ground);

            // Player (Simple Box Character)
            const playerGeo = new THREE.BoxGeometry(2, 4, 2);
            const playerMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.y = 2;
            scene.add(player);

            // Animation Loop
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            // Keep camera following the player
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 15;
            camera.lookAt(player.position.x, player.position.y, player.position.z);
            
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            if(camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>

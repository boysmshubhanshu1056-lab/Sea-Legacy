name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.1
          use-dotnet: false

      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          mkdir -p /Users/runner/Library/Application\ Support/Godot/export_templates/4.2.1.stable
          tar -xvzf Godot_v4.2.1-stable_export_templates.tpz
          mv templates/* /Users/runner/Library/Application\ Support/Godot/export_templates/4.2.1.stable/

      - name: Generate Xcode Project
        run: |
          mkdir -p build
          # Export the Xcode project
          godot --headless --export-release "iOS" build/Sea_Legacy.ipa

      - name: Compile with Xcode (Unsigned)
        run: |
          cd build/Sea_Legacy.ios
          
          # Build the app using Apple's compiler, skipping signatures for LiveContainer
          xcodebuild build \
            -project Sea_Legacy.xcodeproj \
            -scheme Sea_Legacy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          cd build
          mkdir -p Payload
          # Move the compiled .app into the Payload folder
          cp -r Sea_Legacy.ios/build/Build/Products/Release-iphoneos/Sea_Legacy.app Payload/
          # Zip it into an IPA
          zip -r SeaLegacy.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SeaLegacy-iOS-Real
          path: build/SeaLegacy.ipa

name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Godot & Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.1-stable_linux.x86_64
          
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          
          # Using absolute paths to avoid bash expansion bugs
          mkdir -p /home/runner/.local/share/godot/export_templates/4.2.1.stable
          unzip -q Godot_v4.2.1-stable_export_templates.tpz
          mv templates/* /home/runner/.local/share/godot/export_templates/4.2.1.stable/

      - name: Import and Export Game Data
        run: |
          mkdir -p build
          # Export the game data
          ./Godot_v4.2.1-stable_linux.x86_64 --headless --export-release "Linux" build/Sea_Legacy.pck
          
          echo "--- CHECKING BUILD FOLDER ---"
          ls -la build/
          echo "-----------------------------"

      - name: Create iOS App Folder Structure
        run: |
          mkdir -p build/Payload/Sea_Legacy.app
          cp build/Sea_Legacy.pck build/Payload/Sea_Legacy.app/
          
          cat << 'EOF' > build/Payload/Sea_Legacy.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple1//DTD PLIST .0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Sea Legacy</string>
            <key>CFBundleExecutable</key>
            <string>Sea_Legacy</string>
            <key>CFBundleIdentifier</key>
            <string>com.prince.sealegacy</string>
            <key>CFBundleName</key>
            <string>Sea Legacy</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
          </dict>
          </plist>
          EOF

      - name: Zip into .ipa
        run: |
          cd build
          zip -r SeaLegacy.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SeaLegacy-iOS
          path: build/SeaLegacy.ipa

name: Build iOS and Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Capacitor
        run: |
          npm install
          npx cap init "Sea Legacy" "com.prince.sealegacy" --web-dir="."
          npx cap add ios

      - name: Build iOS (Unsigned for LiveContainer)
        run: |
          cd ios/App
          # Compile the app using Apple's Xcode without signatures
          xcodebuild build -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          
          mkdir -p ../../build/Payload
          cp -r build/Build/Products/Release-iphoneos/App.app ../../build/Payload/Sea_Legacy.app
          cd ../../build
          zip -r SeaLegacy.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SeaLegacy-IPA
          path: build/SeaLegacy.ipa

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Capacitor & Build Android
        run: |
          npm install
          npx cap init "Sea Legacy" "com.prince.sealegacy" --web-dir="."
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SeaLegacy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

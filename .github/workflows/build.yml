name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.1
          use-dotnet: false

      # This action automatically downloads templates, imports, and exports safely
      - name: Export Game Data (Linux PCK)
        uses: firebelley/godot-export@v5.2.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false

      - name: Create iOS App Folder Structure
        run: |
          mkdir -p build/Payload/Sea_Legacy.app
          # The export action puts the file in build/Linux/Sea_Legacy.pck
          cp build/Linux/Sea_Legacy.pck build/Payload/Sea_Legacy.app/
          
          cat << 'EOF' > build/Payload/Sea_Legacy.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Sea Legacy</string>
            <key>CFBundleExecutable</key>
            <string>Sea_Legacy</string>
            <key>CFBundleIdentifier</key>
            <string>com.prince.sealegacy</string>
            <key>CFBundleName</key>
            <string>Sea Legacy</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
          </dict>
          </plist>
          EOF

      - name: Zip into .ipa
        run: |
          cd build
          zip -r SeaLegacy.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SeaLegacy-iOS
          path: build/SeaLegacy.ipa

name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.1
          use-dotnet: false

      - name: Import Project & Create Data Pack
        run: |
          mkdir -p build
          godot --headless --export-release "iOS" build/Sea_Legacy.pck

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: SeaLegacy-iOS-Build
          path: build/

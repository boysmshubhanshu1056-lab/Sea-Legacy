name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run it manually from GitHub

jobs:
  build-ios:
    runs-on: macos-latest # Apple builds MUST run on a Mac runner
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.1
          use-dotnet: false

      - name: Download Export Templates
        run: |
          wget https://downloads.tuxfamily.org/godotengine/4.2.1/Godot_v4.2.1-stable_export_templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.2.1.stable
          tar -xvzf Godot_v4.2.1-stable_export_templates.tpz
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/4.2.1.stable/

      - name: Export iOS
        uses: firebelley/godot-export@v5.2.0
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.2.1/Godot_v4.2.1-stable_macos.universal.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.2.1/Godot_v4.2.1-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeaLegacy-iOS
          path: build/*.ipa

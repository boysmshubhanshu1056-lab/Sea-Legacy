name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: ubuntu-latest # The strong server that never crashes
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.1-stable_linux.x86_64

      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          mkdir -p /home/runner/.local/share/godot/export_templates/4.2.1.stable
          unzip -q Godot_v4.2.1-stable_export_templates.tpz
          mv templates/* /home/runner/.local/share/godot/export_templates/4.2.1.stable/

      - name: Build Game Data (PCK)
        run: |
          mkdir -p build
          ./Godot_v4.2.1-stable_linux.x86_64 --headless --export-release "Linux" build/Sea_Legacy.pck

      - name: Assemble iOS App
        run: |
          # 1. Extract the pre-compiled iOS App template
          unzip -q /home/runner/.local/share/godot/export_templates/4.2.1.stable/ios.zip -d ios_template
          
          # 2. Create the Apple Payload folder structure
          mkdir -p build/Payload
          
          # 3. Move the app template into Payload
          mv ios_template/Godot.app build/Payload/Sea_Legacy.app
          
          # 4. Rename the executable so LiveContainer recognizes it
          mv build/Payload/Sea_Legacy.app/Godot build/Payload/Sea_Legacy.app/Sea_Legacy
          
          # 5. Inject your game data into the app
          cp build/Sea_Legacy.pck build/Payload/Sea_Legacy.app/
          
          # 6. Update Info.plist with your app name
          sed -i '' 's/<string>Godot<\/string>/<string>Sea Legacy<\/string>/g' build/Payload/Sea_Legacy.app/Info.plist
          sed -i '' 's/<string>org.godotengine.godot<\/string>/<string>com.prince.sealegacy<\/string>/g' build/Payload/Sea_Legacy.app/Info.plist
          sed -i '' 's/<string>Godot<\/string>/<string>Sea_Legacy<\/string>/g' build/Payload/Sea_Legacy.app/Info.plist || true

      - name: Zip into .ipa
        run: |
          cd build
          zip -r SeaLegacy.ipa Payload/
          ls -la SeaLegacy.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SeaLegacy-iOS-Final
          path: build/SeaLegacy.ipa

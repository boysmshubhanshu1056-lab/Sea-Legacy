name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: ubuntu-latest # Linux server (no memory crashes)
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.1
          use-dotnet: false

      - name: Export Game Data
        run: |
          mkdir -p build
          godot --headless --export-release "iOS" build/Sea_Legacy.pck

      - name: Create iOS App Folder Structure
        run: |
          mkdir -p build/Payload/Sea_Legacy.app
          cp build/Sea_Legacy.pck build/Payload/Sea_Legacy.app/
          
          cat << 'EOF' > build/Payload/Sea_Legacy.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Sea Legacy</string>
            <key>CFBundleExecutable</key>
            <string>Sea_Legacy</string>
            <key>CFBundleIdentifier</key>
            <string>com.prince.sealegacy</string>
            <key>CFBundleName</key>
            <string>Sea Legacy</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
          </dict>
          </plist>
          EOF

      - name: Zip into .ipa
        run: |
          cd build
          zip -r SeaLegacy.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SeaLegacy-iOS
          path: build/SeaLegacy.ipa

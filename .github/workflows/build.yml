name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # STEP 1: Build the game data on Linux (No memory crashes)
  build-pck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.1
          use-dotnet: false

      - name: Export PCK
        run: |
          mkdir -p build
          godot --headless --export-release "Linux" build/Sea_Legacy.pck

      - name: Upload PCK
        uses: actions/upload-artifact@v4
        with:
          name: game-pck
          path: build/Sea_Legacy.pck

  # STEP 2: Wrap it in the iOS Engine on Mac
  build-ipa:
    needs: build-pck
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download PCK
        uses: actions/download-artifact@v4
        with:
          name: game-pck
          path: build/

      - name: Download iOS Template
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          unzip -q Godot_v4.2.1-stable_export_templates.tpz
          # Unzip ONLY the iOS engine
          unzip -q templates/ios.zip -d ios_template

      - name: Inject Game into iOS App
        run: |
          # Copy the iOS app structure
          cp -r ios_template/* build/Payload/
          # Rename it to our app name
          mv build/Payload/Godot.app build/Payload/Sea_Legacy.app
          
          # Rename the executable
          mv build/Payload/Sea_Legacy.app/Godot build/Payload/Sea_Legacy.app/Sea_Legacy
          
          # Put the game data inside
          cp build/Sea_Legacy.pck build/Payload/Sea_Legacy.app/

      - name: Zip into .ipa
        run: |
          cd build
          zip -r SeaLegacy.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SeaLegacy-iOS
          path: build/SeaLegacy.ipa

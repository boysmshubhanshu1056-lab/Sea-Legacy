name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest # Going back to Mac so we can make the .ipa
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.1
          use-dotnet: false

      - name: Download Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.2.1.stable
          tar -xvzf Godot_v4.2.1-stable_export_templates.tpz
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/4.2.1.stable/

      - name: Export iOS App
        run: |
          mkdir -p build
          # This bypasses the editor and exports directly to the iOS wrapper
          godot --headless --export-release "iOS" build/SeaLegacy.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SeaLegacy-iOS
          path: build/*.ipa
